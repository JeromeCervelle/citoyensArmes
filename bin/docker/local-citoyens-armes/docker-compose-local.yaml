services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_citoyens_armes
    ports:
      - "33333:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: citoyens_armes_app
    ports:
      - "9090:9090"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/citoyens_armes
      - SERVER_PORT=9090
    depends_on:
      - mongodb

volumes:
  mongodb_data:
